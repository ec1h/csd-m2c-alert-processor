# Manual trigger only - never runs on push or pull_request. Requires a
# GitHub Environment matching the chosen `environment` input (test/qa/uat
# exist in the non-prod account; `prod` is NOT yet dispatchable - its iac
# folder is a deliberately non-appliable placeholder, see
# iac/prod/prod/alert-processor/README.md) with required reviewers
# configured in repo settings; that protection is not, and cannot be, set
# by this file.
# `environment:` is not a valid key on a job that calls a reusable workflow
# via `uses:` - protection must come from the `with: environment` input
# below, applied inside the reusable workflow's own job.
# Dispatch dropdown + `.github/environments/.env.<environment>` mirror the
# convention used by ec1h-go-n-pay-admin-portal/payment-gateway-utils, whose
# reusable_terragrunt_apply.yml callers read that file to resolve the target
# AWS account/role - this repo previously had no such file, which is a
# likely cause of prior apply failures.
# prod lives at iac/prod/prod/<component> (one AWS account, one env folder)
# while non-prod holds multiple env folders under iac/non-prod/<env>/
# <component> - the ternary below picks the right path per environment.
name: Terragrunt Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        type: environment
        required: true
        default: "uat"

run-name: Deploy to ${{ inputs.environment }}

jobs:
  terragrunt-apply:
    uses: ec1h/reusable-workflows/.github/workflows/reusable_terragrunt_apply.yml@0.1.11
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      terragrunt_dir: ${{ inputs.environment == 'prod' && './iac/prod/prod/alert-processor' || format('./iac/non-prod/{0}/alert-processor', inputs.environment) }}
      terraform_version: "1.11.4"
      terragrunt_version: "0.68.6"
