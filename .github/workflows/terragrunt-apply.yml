# Manual trigger only - never runs on push or pull_request. Requires a
# GitHub Environment named "uat" with required reviewers configured in repo
# settings; that protection is not, and cannot be, set by this file.
# `environment:` is not a valid key on a job that calls a reusable workflow
# via `uses:` - protection must come from the `with: environment` input
# below, applied inside the reusable workflow's own job.
# Input names/version are inferred, same caveat as terragrunt-plan.yml.
name: Terragrunt Apply (UAT)

on:
  workflow_dispatch: {}

jobs:
  terragrunt-apply:
    uses: ec1h/reusable-workflows/.github/workflows/reusable_terragrunt_apply.yml@0.1.11
    secrets: inherit
    with:
      environment: uat
      terragrunt_dir: "./iac/non-prod/uat/alert-processor"
      terraform_version: "1.11.4"
      terragrunt_version: "0.68.6"
