# Reference design for an org reusable workflow, mirroring the shape of
# ec1h/reusable-workflows/.github/workflows/reusable_build_and_test_node_service.yml
# (confirmed via ec1h-go-n-pay-payment-gateway-utils/.github/workflows/test.yaml).
# Called locally (./.github/workflows/...) since this repo cannot push to
# ec1h/reusable-workflows directly - propose upstreaming this file there once
# reviewed, so other Python repos in the org can call it the same way Node
# repos call the node equivalent.
name: Reusable - Build and Test Python Service

on:
  workflow_call:
    inputs:
      python_version:
        description: "Python version to set up"
        type: string
        default: "3.12"
      working_directory:
        description: "Directory containing pyproject.toml/requirements files"
        type: string
        default: "."
      requirements_file:
        description: "Dev/test requirements file to install"
        type: string
        default: "requirements-dev.txt"
      pytest_args:
        description: "Arguments passed to pytest"
        type: string
        default: "-q"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        run: pip install -r ${{ inputs.requirements_file }}

      - name: Run tests
        run: pytest ${{ inputs.pytest_args }}
