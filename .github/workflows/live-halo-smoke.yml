# Manual trigger only - never runs on push or pull_request. Gated by the
# "uat" GitHub Environment (same as terragrunt-apply.yml); configure required
# reviewers there in repo settings before granting real Halo secrets to it.
#
# Requires these to be set on the "uat" environment:
#   vars.HALO_LIVE_BASE_URL          - e.g. https://ec1helpdesk.haloitsm.com
#   secrets.HALO_LIVE_CLIENT_ID
#   secrets.HALO_LIVE_CLIENT_SECRET
#   vars.HALO_LIVE_TICKET_TYPE_ID    - optional, defaults to 64 in the test
#   vars.HALO_LIVE_TEAM_ID           - optional, defaults to 12 in the test
name: Live Halo Smoke Test

on:
  workflow_dispatch:
    inputs:
      allow_ticket_creation:
        description: "Create one real Halo ticket (else auth-only check)"
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_halo_live_integration.py
        env:
          HALO_LIVE_BASE_URL: ${{ vars.HALO_LIVE_BASE_URL }}
          HALO_LIVE_CLIENT_ID: ${{ secrets.HALO_LIVE_CLIENT_ID }}
          HALO_LIVE_CLIENT_SECRET: ${{ secrets.HALO_LIVE_CLIENT_SECRET }}
          HALO_LIVE_TICKET_TYPE_ID: ${{ vars.HALO_LIVE_TICKET_TYPE_ID }}
          HALO_LIVE_TEAM_ID: ${{ vars.HALO_LIVE_TEAM_ID }}
          HALO_LIVE_ALLOW_TICKET_CREATION: ${{ inputs.allow_ticket_creation && '1' || '0' }}
