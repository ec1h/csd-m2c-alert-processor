# Repo-owned release workflow - not yet calling ec1h/reusable-workflows.
# Structured to be lifted into a `workflow_call` reusable workflow later.
#
# Never rebuilds the Lambda zip: it takes the artifact that the successful
# Build run produced for this exact commit, verifies its hash, and attaches
# it to a semver GitHub Release. deploy.yml then deploys that release asset,
# so every environment receives the same bytes that passed tests.
#
# Must be dispatched from the default branch: Build only produces a
# deployable artifact for the commit that was actually tested there.
name: Create Release

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Choose semantic versioning increment
        type: choice
        required: true
        default: PATCH
        options:
          - PATCH
          - MINOR
          - MAJOR

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCOPE: ${{ inputs.scope }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BUILD_WORKFLOW_FILE: build.yml
    steps:
      - name: Require the default branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Releases must be created from ${DEFAULT_BRANCH}, not ${GITHUB_REF}."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Fetch the tested package for this commit
        run: |
          set -euo pipefail
          run_id=$(gh run list \
            --workflow "${BUILD_WORKFLOW_FILE}" \
            --commit "${GITHUB_SHA}" \
            --status success \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "${run_id}" ]; then
            echo "::error::No successful Build run found for ${GITHUB_SHA}. Let Build pass on this commit first."
            exit 1
          fi
          echo "Using Build run ${run_id}"
          gh run download "${run_id}" --name "lambda-package-${GITHUB_SHA}" --dir dist
          cd dist
          sha256sum --check ./*.sha256

      - name: Calculate next version
        id: version
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "${SCOPE}" in
            MAJOR) major=$((major + 1)); minor=0; patch=0 ;;
            MINOR) minor=$((minor + 1)); patch=0 ;;
            PATCH) patch=$((patch + 1)) ;;
            *) echo "::error::Unknown scope ${SCOPE}"; exit 1 ;;
          esac
          next="v${major}.${minor}.${patch}"
          echo "Previous: ${latest} -> Next: ${next}"
          echo "tag=${next}" >> "$GITHUB_OUTPUT"

      - name: Create release with the tested package attached
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes
          {
            echo "### Released ${TAG}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Assets: $(ls dist | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"
