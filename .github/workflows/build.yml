# Repo-owned Python build workflow - not yet calling ec1h/reusable-workflows.
# Per the Solutions Architect: build this ourselves for now, written so it can
# be lifted into a real `workflow_call` reusable workflow later (pinned
# actions, named env vars instead of scattered literals, one job per concern)
# without a rewrite. Propose upstreaming once access/approval exists.
#
# Runs on every push to main and every PR (no path filters) - this
# intentionally broadens secret-scan and test coverage to match
# ec1h-enl-configuration's build.yml shape, which also has no path filters.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      DEV_REQUIREMENTS_FILE: "requirements-dev.txt"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r ${{ env.DEV_REQUIREMENTS_FILE }}
      - run: pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Self-hosted gitleaks CLI, not gitleaks/gitleaks-action - the action
      # requires a paid org license (GITLEAKS_LICENSE) that ec1h doesn't have
      # configured. The CLI itself remains free/open-source.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - run: gitleaks detect --source . --log-opts="--all" --redact -v

  package:
    needs: [test, secret-scan]
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: "3.12"
      LAMBDA_SOURCE_DIR: "src/handlers/alert-processor"
      RUNTIME_REQUIREMENTS_FILE: "requirements.txt"
      COMPONENT_NAME: "csd-m2c-alert-processor"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Vendor runtime dependencies (e.g. a pinned boto3) alongside the
      # handler code - Terraform's archive_file only zips LAMBDA_SOURCE_DIR
      # itself, so anything the Lambda needs beyond the AWS-provided runtime
      # must be installed into the same directory the zip is built from.
      - name: Assemble Lambda package contents
        run: |
          set -euo pipefail
          rm -rf build/package
          mkdir -p build/package
          cp -r "${LAMBDA_SOURCE_DIR}/." build/package/
          pip install -r "${RUNTIME_REQUIREMENTS_FILE}" --target build/package

      - name: Build deployable zip
        id: build_zip
        run: |
          set -euo pipefail
          artifact="${COMPONENT_NAME}-${GITHUB_SHA::12}.zip"
          cd build/package
          find . -name '__pycache__' -type d -prune -exec rm -rf {} +
          zip -r "../../${artifact}" . -x '*.pyc'
          cd ../..
          sha256sum "${artifact}" > "${artifact}.sha256"
          echo "artifact_name=${artifact}" >> "$GITHUB_OUTPUT"

      - name: Record build summary
        run: |
          {
            echo "### Lambda package built"
            echo "- Artifact: \`${{ steps.build_zip.outputs.artifact_name }}\`"
            echo "- SHA256: \`$(cut -d' ' -f1 "${{ steps.build_zip.outputs.artifact_name }}.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lambda-package-${{ github.sha }}
          path: |
            ${{ steps.build_zip.outputs.artifact_name }}
            ${{ steps.build_zip.outputs.artifact_name }}.sha256
          retention-days: 14
