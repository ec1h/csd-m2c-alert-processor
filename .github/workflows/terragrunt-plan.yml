# Input names/version are inferred from other ec1h repos' callers
# (ec1h-go-n-pay-admin-portal, ec1h-go-n-pay-payment-gateway-utils) - the
# reusable-workflows repo itself could not be inspected in this session.
# Confirm the exact `with:` schema and current version tag against
# ec1h/reusable-workflows before merging this file.
# Matrix covers test/qa/uat (same, known non-prod account). prod is
# deliberately excluded - there is no real prod AWS account yet, and prod
# should never be auto-planned from a PR trigger anyway; see
# iac/prod/prod/alert-processor/README.md.
name: Terragrunt Plan

on:
  pull_request:
    paths:
      - "iac/**"

permissions:
  id-token: write
  contents: read

jobs:
  terragrunt-plan:
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      matrix:
        environment: ["test", "qa", "uat"]
    uses: ec1h/reusable-workflows/.github/workflows/reusable_terragrunt_plan.yml@0.1.11
    secrets: inherit
    with:
      env_vars: "TF_VAR_environment=${{ matrix.environment }}"
      terragrunt_dir: "./iac/non-prod/${{ matrix.environment }}/alert-processor"
      terraform_version: "1.11.4"
      terragrunt_version: "0.68.6"
